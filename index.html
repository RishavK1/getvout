    <style>
      :root { background: #f5f3ed; color: #171817; }
      .app-boot-screen { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 18px; font: 700 17px/1.1 Arial, sans-serif; letter-spacing: -.05em; }
      .app-boot-wordmark { display: flex; align-items: center; gap: 10px; }
      .app-boot-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: #d9ff00; background: #171817; font: 700 22px/1 Georgia, serif; letter-spacing: 0; }
      .app-boot-period { color: #1748ff; }
      .app-boot-indicator { width: 52px; height: 2px; overflow: hidden; border-radius: 2px; background: #deddd6; }
      .app-boot-indicator::after { display: block; width: 40%; height: 100%; content: ""; border-radius: inherit; background: #d9ff00; animation: app-boot-travel 1s ease-in-out infinite alternate; }
      @keyframes app-boot-travel { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-indicator::after { animation: none; width: 100%; } }
      noscript .page-prerender { max-width: 740px; margin: 12vh auto; padding: 32px; color: #171817; font: 16px/1.6 Arial, sans-serif; }
      noscript .page-prerender h1 { max-width: 700px; font-size: clamp(38px, 8vw, 72px); line-height: .98; letter-spacing: -.07em; }
      noscript .page-prerender a { color: #1748ff; }
